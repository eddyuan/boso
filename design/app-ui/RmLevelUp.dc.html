<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
  <style>
:root, .light {
  --bg: #FFF6EC; --surface: #FFFFFF; --el: #F7EADA; --line: #EEDDC9;
  --text: #2B1F16; --muted: #7D6B5B;
  --primary: #FFC53D; --primary-press: #E09E00; --primary-soft: #FFF0C2; --primary-ink: #8A5A00; --on-primary: #2B1F16;
  --cheek: #FF8A4C;
  --green: #2F9E5E; --green-soft: #DDF2E4; --red: #D9453F; --red-soft: #FCE3E1; --sun: #FFC247;
}
.dark {
  --bg: #1A1410; --surface: #251D17; --el: #30261E; --line: #3D3128;
  --text: #FAF1E7; --muted: #B6A594;
  --primary: #FFCB4D; --primary-press: #B88312; --primary-soft: #3A2E12; --primary-ink: #FFD36B; --on-primary: #1A1410;
  --cheek: #FF9A5E;
  --green: #5BC98A; --green-soft: #1E3A2A; --red: #FF7A73; --red-soft: #41211E; --sun: #FFCB5C;
}
body { margin: 0; background: #E9E2DA; }
a { color: var(--primary-ink); text-decoration: none; font-weight: 800; }
a:hover { color: var(--primary-press); }
.screen { box-sizing: border-box; width: 390px; background: var(--bg); color: var(--text);
  font-family: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; font-weight: 600;
  display: flex; flex-direction: column; padding: 54px 16px 34px; }
.display { font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; font-weight: 600; letter-spacing: -0.2px; }
.h1 { font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 30px; line-height: 36px; margin: 0; text-wrap: balance; }
.sub { font-size: 16px; line-height: 24px; color: var(--muted); margin: 0; text-wrap: pretty; }
.label { font-size: 14px; line-height: 20px; font-weight: 800; color: var(--text); }
.small { font-size: 14px; line-height: 20px; color: var(--muted); }
.btn { box-sizing: border-box; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 18px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 0 var(--primary-press); }
.btn-secondary { background: var(--surface); color: var(--text); box-shadow: 0 3px 0 var(--line); }
.btn-apple { background: var(--text); color: var(--bg); box-shadow: 0 3px 0 #00000033; }
.btn-disabled { background: var(--el); color: var(--muted); }
.btn-danger { background: var(--surface); color: var(--red); box-shadow: 0 3px 0 var(--line); }
.link { text-align: center; font-weight: 800; color: var(--primary-ink); font-size: 16px; padding: 12px 0; }
.field { box-sizing: border-box; height: 56px; border-radius: 16px; background: var(--el); border: 2px solid transparent;
  display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 17px; color: var(--muted); }
.field-focus { border-color: var(--primary-press); background: var(--surface); color: var(--text); box-shadow: 0 0 0 4px var(--primary-soft); }
.field-filled { color: var(--text); }
.chip { box-sizing: border-box; height: 42px; border-radius: 999px; background: var(--el); border: 2px solid transparent;
  display: flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 15px; font-weight: 700; color: var(--text); }
.chip-on { background: var(--primary-soft); color: var(--primary-ink); }
.card { background: var(--surface); border-radius: 20px; box-shadow: 0 1px 3px rgba(43,31,22,.05); }
.option { box-sizing: border-box; background: var(--el); border: 2px solid transparent; border-radius: 18px; padding: 16px;
  display: flex; align-items: center; gap: 14px; }
.option-on { border-color: var(--primary-press); background: var(--primary-soft); }
.radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; flex-shrink: 0; }
.radio-on { border: 7px solid var(--primary-press); }
.top { display: flex; align-items: center; gap: 14px; height: 44px; }
.back { width: 44px; height: 44px; border-radius: 14px; background: var(--el); border: 2px solid transparent; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0; }
.track { flex: 1; height: 12px; border-radius: 999px; background: var(--el); overflow: hidden; }
.fill { height: 12px; border-radius: 999px; background: var(--primary-press); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-muted { background: var(--el); color: var(--muted); }
.badge-orange { background: var(--primary-soft); color: var(--primary-ink); }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.divider { height: 1px; background: var(--line); margin: 0 16px; }
.iconbox { width: 44px; height: 44px; border-radius: 14px; background: var(--el); display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0; }
.section { font-size: 13px; line-height: 16px; font-weight: 800; letter-spacing: 0.8px; color: var(--muted); text-transform: uppercase; padding: 0 4px; }
.otp { width: 48px; height: 60px; border-radius: 14px; background: var(--el); border: 2px solid transparent; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-size: 26px; font-weight: 600; color: var(--text); }
.otp-on { border-color: var(--primary-press); box-shadow: 0 0 0 4px var(--primary-soft); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 18px; flex-shrink: 0; }

/* ---- App tabs ---- */
.tabbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; display: flex; align-items: center; gap: 4px;
  padding: 6px 8px; background: var(--surface); border-radius: 999px; box-sizing: border-box;
  box-shadow: 0 10px 30px rgba(43,31,22,.20); }
.tab { width: 72px; height: 52px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .2px; }
.tab-on { background: var(--primary-soft); color: var(--primary-ink); }
.post { background: var(--surface); border-radius: 20px; box-shadow: 0 1px 3px rgba(43,31,22,.05); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.halo { border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.photo { border-radius: 14px; height: 148px; background: linear-gradient(140deg, #FFE1A8, #FFC07A 45%, #9FD4B0); }
.metrow { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 14px; font-weight: 800; }
.met { display: flex; align-items: center; gap: 6px; }
.stat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 0; }
.stat b { font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 20px; }
.vline { width: 1px; align-self: stretch; background: var(--line); }
/* map */
.map { position: absolute; inset: 0; background: #EFE7DC; overflow: hidden; }
.blk { position: absolute; background: #E4DACC; border-radius: 5px; }
.park { position: absolute; background: #D6E8CB; border-radius: 26px; }
.road { position: absolute; background: #FAF6EF; }
.water { position: absolute; background: #CFE3EC; border-radius: 30px; }
.marker { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--surface); box-sizing: border-box;
  box-shadow: 0 4px 10px rgba(43,31,22,.25); }
.glass { background: var(--surface); box-sizing: border-box; border-radius: 999px;
  box-shadow: 0 8px 20px rgba(43,31,22,.16); }
.seg { display: flex; gap: 4px; background: var(--el); border-radius: 999px; padding: 4px; }
.seg-item { flex: 1; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: var(--muted); }
.seg-on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(43,31,22,.10); }
.rbtn { width: 44px; height: 44px; border-radius: 999px; background: var(--el); display: flex; align-items: center;
  justify-content: center; color: var(--text); flex-shrink: 0; }
.rbtn-brand { background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 var(--primary-press); }
.searchbar { height: 48px; border-radius: 999px; background: var(--el); display: flex; align-items: center; gap: 10px;
  padding: 0 16px; color: var(--muted); font-size: 16px; }
.textarea { border-radius: 16px; background: var(--el); padding: 16px; font-size: 17px; line-height: 25px; }
.tile { width: 76px; height: 76px; border-radius: 16px; background: var(--el); display: flex; align-items: center;
  justify-content: center; color: var(--muted); }
/* spec sheet */
.sheet { box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'Nunito', ui-rounded, system-ui, sans-serif;
  font-weight: 600; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
.panel { background: var(--surface); border-radius: 20px; padding: 20px; box-shadow: 0 1px 3px rgba(43,31,22,.05); }
.bar { background: var(--primary); height: 16px; border-radius: 4px; }
.spec-h { font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: 20px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: var(--primary-ink); }
.rule { display: flex; gap: 10px; font-size: 14px; line-height: 21px; }
.tick { color: var(--green); font-weight: 800; }
.cross { color: var(--red); font-weight: 800; }


/* ---- roadmap additions ---- */
.toggle { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(43,31,22,.25); }
.toggle-on { background: var(--green); }
.toggle-on::after { left: 23px; }
.scrim { position: absolute; inset: 0; background: rgba(43,31,22,.38); }
.bsheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px 34px;
  box-shadow: 0 -10px 30px rgba(43,31,22,.18); display: flex; flex-direction: column; }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); align-self: center; margin-bottom: 14px; }
.why { background: var(--el); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 19px; color: var(--muted); display: flex; gap: 8px; }
.why b { color: var(--text); font-weight: 800; }
.draft { background: var(--primary-soft); border-radius: 4px 16px 16px 16px; padding: 10px 12px; font-size: 15px; line-height: 21px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface);
  font-size: 13px; font-weight: 800; box-shadow: 0 1px 3px rgba(43,31,22,.08); white-space: nowrap; flex-shrink: 0; }
.pill-on { background: var(--text); color: var(--bg); }
.meter { height: 10px; border-radius: 999px; background: var(--el); overflow: hidden; flex: 1; }
.meter > div { height: 10px; border-radius: 999px; }
.xp { font-size: 12px; font-weight: 800; color: var(--primary-ink); }
.lock { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; }
.slot { border-radius: 18px; background: var(--surface); box-shadow: 0 1px 3px rgba(43,31,22,.05); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; border: 2px solid transparent; box-sizing: border-box; }
.slot-on { border-color: var(--primary-press); background: var(--primary-soft); }
.slot-locked { background: var(--el); box-shadow: none; }
.hand { font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; font-weight: 500; }

</style>
</helmet>

<div style="position:absolute; left:70px; top:200px; width:8px; height:14.4px; border-radius:3px; background:#2F9E5E; transform: rotate(0deg);"></div>
<div style="position:absolute; left:300px; top:215px; width:10px; height:18px; border-radius:3px; background:#2F7BEA; transform: rotate(5deg);"></div>
<div style="position:absolute; left:180px; top:90px; width:7px; height:12.6px; border-radius:3px; background:#E05780; transform: rotate(0deg);"></div>

<div style="position:absolute; left:30px; top:250px; width:7px; height:12.6px; border-radius:3px; background:#8B5CF6; transform: rotate(10deg);"></div>
<div style="display:flex; flex-direction:column; align-items:center; margin-top:40px;">
  <span class="badge badge-orange" style="height:30px; font-size:14px; padding:0 14px;">Bond level 8</span>

  <ellipse cx="60" cy="58" rx="31" ry="25" fill="#FFF7D6"></ellipse>
  <circle cx="37" cy="66" r="9" fill="#FF8A4C"></circle><circle cx="83" cy="66" r="9" fill="#FF8A4C"></circle>
  <path d="M42 56 q6 -8 12 0 M66 56 q6 -8 12 0" stroke="#2B1F16" stroke-width="3.8" fill="none" stroke-linecap="round"></path>
  <path d="M54 60 q6 -4 12 0 q-1 4 -6 5 q-5 -1 -6 -5 Z" fill="#F29C38"></path><ellipse cx="60" cy="68" rx="4.5" ry="3.5" fill="#8A3A1A"></ellipse><path d="M56 70 q4 4 8 0" stroke="#F29C38" stroke-width="3" fill="none" stroke-linecap="round"></path>
  
  <path transform="translate(14 26) scale(1.1)" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#FFC53D"></path><path transform="translate(106 18) scale(0.9)" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#FFC53D"></path><path transform="translate(100 100) scale(0.7)" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#FFC53D"></path>
</svg></div>
  <h1 class="h1" style="text-align:center; margin-top:8px; font-size:34px; line-height:40px;">Mochi can fly further!</h1>
  <p class="sub" style="text-align:center; margin-top:8px;">Errands now reach 3 km, so Mochi can bring back news from across the river.</p>
</div>
<div class="card" style="margin-top:24px; padding:12px 14px; display:flex; align-items:center; gap:12px;">
  <div class="iconbox" style="background: var(--el); color: var(--muted);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 21V4.5M5.5 5h11l-2 4 2 4h-11"/></svg></div>
  <div style="flex:1;"><div class="label">Next at level 10</div><div class="small" style="font-size:13px;">A title for Mochi</div></div>
  <span class="xp">~2 weeks</span>
</div>
<div class="btn btn-primary" style="margin-top:auto;">Send Mochi somewhere new</div>
<div class="link" style="padding-bottom:0;">Later</div>
</div>
</x-dc>
</body>
</html>
